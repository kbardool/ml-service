[project]
name = "ml-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kevin Bardool", email = "14542085+kbardool@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
#    "error",
    # anyio >= 4.14 deprecates the anyio.abc.BlockingPortal alias that
    # starlette's testclient still imports at module level, which turns
    # every tests/api collection into an error.  Fixed on starlette main
    # (Kludex/starlette#3497) but not in any release as of 1.6.0; drop
    # this filter and bump the starlette floor once it ships.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]